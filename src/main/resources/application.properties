spring.application.name=SmartTouristSafety

# Server Port: uses Render dynamic PORT if present, otherwise defaults to 8081 for local development
server.port=${PORT:8081}

# Database configuration: uses environment variables in cloud/production, defaults to local MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/tourist_safety_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# CORS allowed origin patterns (comma-separated; defaults to localhost Vite and any Vercel domain)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://*.vercel.app}